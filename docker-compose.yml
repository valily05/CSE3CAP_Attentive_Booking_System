name: careconnect

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: careconnect
      POSTGRES_PASSWORD: careconnect # local dev only; never reuse elsewhere
      POSTGRES_DB: careconnect
      TZ: Asia/Jakarta
    ports:
      - "5433:5432" # 5433 so it never collides with a host Postgres
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careconnect"]
      interval: 2s
      retries: 30

  # Catches every email the API sends in development: http://localhost:8025
  mail:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
